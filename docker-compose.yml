services:
  app:
    build:
      context: .
      # Stamp the build so /api/version reports something meaningful. Both are
      # read from .env (or the shell); without them the app reports version
      # "dev" and commit "unknown":
      #   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose build
      # Setting CPO_VERSION in .env instead overrides the baked-in value at
      # runtime, which takes effect on restart without a rebuild.
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "8002:8002"
    volumes:
      # Legacy JSON config — only needed until the one-time SQLite import has
      # run (config.json becomes config.json.migrated); can be removed after.
      - ./config:/app/config
      # SQLite database (cpo.db) + archived legacy JSON data
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
