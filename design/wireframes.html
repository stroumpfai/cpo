<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CPO · Wireframe Propositions</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Caveat:wght@400;600;700&family=Architects+Daughter&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #555;
    --ink-faint: #999;
    --paper: #fbfaf6;
    --paper-2: #f3f0e6;
    --accent: #d7372b;     /* tomato */
    --accent-soft: #fde0dc;
    --grid: #e8e4d6;
  }
  html, body { background: var(--paper-2); color: var(--ink); font-family: 'Kalam', cursive; }
  body { margin: 0; }

  /* Sketchy helpers */
  .ink { color: var(--ink); }
  .soft { color: var(--ink-soft); }
  .faint { color: var(--ink-faint); }
  .accent { color: var(--accent); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .hand { font-family: 'Kalam', cursive; }
  .scribble { font-family: 'Caveat', cursive; }
  .arch { font-family: 'Architects Daughter', cursive; }

  .wf {
    width: 100%; height: 100%;
    background: var(--paper);
    padding: 28px;
    box-sizing: border-box;
    overflow: hidden;
    position: relative;
    font-size: 15px;
    line-height: 1.35;
  }
  .wf.dense { padding: 18px; font-size: 13px; }

  /* Hand-drawn-ish boxes */
  .box {
    border: 2px solid var(--ink);
    border-radius: 14px 11px 16px 12px / 12px 16px 11px 14px;
    background: #fff;
    padding: 10px 12px;
    box-sizing: border-box;
  }
  .box.thin { border-width: 1.5px; }
  .box.dashed { border-style: dashed; }
  .box.shadow { box-shadow: 4px 4px 0 var(--ink); }
  .box.tilt-l { transform: rotate(-0.6deg); }
  .box.tilt-r { transform: rotate(0.5deg); }
  .box.tone { background: var(--paper-2); }
  .box.flag { background: var(--accent); color: #fff; border-color: var(--ink); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 6px 14px;
    background: #fff;
    font-family: 'Kalam', cursive;
    font-weight: 700;
    box-shadow: 2px 2px 0 var(--ink);
    transform: rotate(-0.3deg);
    font-size: 14px;
  }
  .btn.solid { background: var(--ink); color: #fff; }
  .btn.accent { background: var(--accent); color: #fff; border-color: var(--ink); }
  .btn.ghost { box-shadow: none; background: transparent; }

  .field {
    border: 1.8px solid var(--ink);
    border-radius: 10px 8px 12px 9px / 9px 11px 8px 10px;
    background: #fff;
    padding: 8px 10px;
    min-height: 36px;
    display: flex; align-items: center;
    color: var(--ink-soft);
    font-family: 'Kalam', cursive;
  }
  .field.tone { background: var(--paper-2); }
  .field .lbl { color: var(--ink-faint); }

  .chip {
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 12px;
    background: #fff;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.solid { background: var(--ink); color: #fff; }
  .chip.accent { background: var(--accent); color: #fff; border-color: var(--ink); }
  .chip.tone { background: var(--paper-2); }

  .ph {
    background:
      repeating-linear-gradient(
        135deg,
        transparent 0 6px,
        rgba(0,0,0,0.07) 6px 7px
      );
    border: 1.5px dashed var(--ink-faint);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-align: center;
  }

  .row { display: flex; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .grow { flex: 1 1 auto; }

  .squiggle {
    height: 8px;
    background: radial-gradient(circle at 4px 6px, var(--ink) 1px, transparent 2px) repeat-x;
    background-size: 8px 8px;
    opacity: .35;
  }
  hr.sketch {
    border: 0;
    border-top: 2px solid var(--ink);
    border-radius: 50%;
    margin: 10px 0;
    transform: rotate(-0.2deg);
  }

  .pill-tab {
    border-bottom: 2px solid transparent;
    padding: 4px 0;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .pill-tab.on { color: var(--ink); border-color: var(--ink); }

  .h1 { font-family: 'Caveat', cursive; font-size: 30px; line-height: 1; font-weight: 700; }
  .h2 { font-family: 'Caveat', cursive; font-size: 22px; line-height: 1.05; font-weight: 700; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); }

  /* phone frame */
  .phone {
    width: 280px;
    height: 580px;
    border: 3px solid var(--ink);
    border-radius: 38px;
    background: var(--paper);
    padding: 14px 12px 20px;
    box-sizing: border-box;
    position: relative;
    box-shadow: 5px 5px 0 var(--ink);
    margin: 6px;
  }
  .phone::before {
    content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 60px; height: 8px; background: var(--ink); border-radius: 4px;
  }

  .ticket {
    background: #fff;
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    border-radius: 4px;
    position: relative;
  }
  .ticket::before, .ticket::after {
    content: "";
    position: absolute; left: 0; right: 0; height: 12px;
    background:
      radial-gradient(circle at 6px 6px, var(--paper) 5px, transparent 6px) repeat-x;
    background-size: 12px 12px;
  }
  .ticket::before { top: -6px; }
  .ticket::after { bottom: -6px; transform: rotate(180deg); }

  /* canvas styling */
  .dc-section h2 { font-family: 'Caveat', cursive !important; }

  /* misc small ui bits */
  .num-big { font-family: 'Caveat', cursive; font-size: 56px; line-height: 1; }
  .pizza-emoji { font-family: serif; }
  .tag-x { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-faint); }

  table.sketch { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.sketch th, table.sketch td { text-align: left; padding: 5px 4px; border-bottom: 1.5px dashed var(--ink-faint); }
  table.sketch th { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; letter-spacing: .05em; }
  table.sketch td.num { font-family: 'JetBrains Mono', monospace; }

  .annot {
    font-family: 'Caveat', cursive;
    color: var(--accent);
    font-size: 18px;
    position: absolute;
  }
  .annot svg { display: block; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .35; transform: scale(.7); }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
